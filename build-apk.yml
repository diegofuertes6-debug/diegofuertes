# This is a basic workflow to help you get started with Actions

name: CI
name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Buildozer and python-for-android
        uses: actions/cache@v4
        with:
          path: |
            ./.buildozer
            ~/.cache/python-for-android
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git unzip zip build-essential openjdk-11-jdk zlib1g-dev libncurses5-dev libffi-dev libssl-dev libsqlite3-dev autoconf automake libtool pkg-config libc6-dev-i386 lib32stdc++6 pkg-config

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --user buildozer
          echo "${HOME}/.local/bin" >> $GITHUB_PATH

      - name: Create Buildozer config
        run: |
          mkdir -p ~/.config
          printf '[buildozer]\nlog_level = 2\nwarn_on_root = 0\n' > ~/.config/buildozer.ini

      - name: Build APK (debug)
        run: |
          cd $GITHUB_WORKSPACE
          buildozer -v android debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: repartidor-apk-debug
          path: bin/*.apk

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
