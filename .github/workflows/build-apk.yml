name: Build APK (Debug & Release)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Buildozer & p4a
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
            ~/.cache/python-for-android
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev python3-dev \
            libc6-dev-i386 lib32stdc++6

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel Cython==0.29.33
          python -m pip install buildozer==1.5.0

      - name: Build debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          buildozer android debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: repartidor-apk-debug
          path: |
            bin/*-debug.apk
            ./.buildozer/android/platform/build-*/dists/*/build/outputs/apk/debug/*.apk

      - name: Build release APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          buildozer android release

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: repartidor-apk-release
          path: |
            bin/*-release.apk
            ./.buildozer/android/platform/build-*/dists/*/build/outputs/apk/release/*.apk
