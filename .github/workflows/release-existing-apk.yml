name: Publish existing APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate APK
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$(python3 - <<'PY'
          from pathlib import Path

          roots = (Path("bin"), Path(".github/workflows"))
          candidates = [
              path for root in roots if root.exists() for path in root.rglob("*.apk")
          ]

          if not candidates:
              raise SystemExit(1)

          latest = max(candidates, key=lambda path: path.stat().st_mtime)
          print(latest.as_posix())
          PY
          )"

          if [ -z "$source_apk" ]; then
            echo "No se encontró ninguna APK en bin/ ni en .github/workflows/."
            exit 1
          fi
 
          artifact_name="$(basename "$source_apk")"
          mkdir -p release
          cp "$source_apk" "release/$artifact_name"

          echo "source_apk=$source_apk" >> "$GITHUB_OUTPUT"
          echo "release_apk=release/$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          ls -l "$source_apk" "release/$artifact_name"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.artifact_name }}
          path: ${{ steps.locate.outputs.release_apk }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK publicada ${{ github.run_number }}
          files: |
            ${{ steps.locate.outputs.release_apk }}
