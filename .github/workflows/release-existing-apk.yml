name: Publish existing APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate APK
        id: locate
        shell: bash
        run: |
          set -e
          if [ ! -d bin ]; then
            echo "No existe el directorio bin/"
            exit 1
          fi

          source_apk="$(find bin -type f -name '*.apk' | sort | head -n 1)"

          if [ -z "$source_apk" ]; then
            echo "No se encontró ninguna APK en bin/"
            exit 1
          fi

          mkdir -p release
          cp "$source_apk" "release/repartidor-firmada.apk"

          echo "source_apk=$source_apk" >> "$GITHUB_OUTPUT"
          echo "release_apk=release/repartidor-firmada.apk" >> "$GITHUB_OUTPUT"
          ls -l "$source_apk" "release/repartidor-firmada.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: repartidor-apk
          path: ${{ steps.locate.outputs.release_apk }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK publicada ${{ github.run_number }}
          files: |
            ${{ steps.locate.outputs.release_apk }}
