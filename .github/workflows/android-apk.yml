name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/enrrutador-prioridades

jobs:
  build-android:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROIDSDK: ${{ github.workspace }}/android-sdk
      APP_ANDROID_SDK_PATH: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OS dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            libncurses5-dev libffi-dev libssl-dev \
            autoconf automake libtool pkg-config wget tar

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools"
          mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools/"* \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0"

          test -x "$ANDROID_SDK_ROOT/build-tools/31.0.0/aidl"
          test -f "$ANDROID_SDK_ROOT/platforms/android-31/android.jar"

      - name: Export Android SDK paths
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/build-tools/31.0.0" >> $GITHUB_PATH

      - name: Install Buildozer and Python requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 Cython==0.29.33

      - name: Build APK
        run: |
          buildozer android debug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          APK_PATH=$(find bin -maxdepth 1 -type f -name "*-debug.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "No debug APK generated in bin/."
            exit 1
          fi
          cp "$APK_PATH" dist/repartidorapp-debug.apk
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: repartidorapp-debug-apk
          path: dist/repartidorapp-debug.apk
          if-no-files-found: error
