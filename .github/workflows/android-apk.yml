name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - copilot/fix-github-actions-job
      - feature/enrrutador-prioridades

jobs:
  build-android:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: ${{ runner.home }}/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.home }}/.buildozer/android/platform/android-sdk
      ANDROIDSDK: ${{ runner.home }}/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OS dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            libncurses5-dev libffi-dev libssl-dev \
            autoconf automake libtool pkg-config wget tar

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools-temp
          mv cmdline-tools-temp/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.3"

      - name: Export Android SDK paths
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/build-tools/31.0.3" >> $GITHUB_PATH

      - name: Install Buildozer and Python requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython

      - name: Build APK
        run: |
          buildozer android debug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          APK_PATH=$(find . -type f -iname "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK generated."
            exit 1
          fi
          cp "$APK_PATH" dist/app-release.apk
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: dist/app-release.apk
          if-no-files-found: error
